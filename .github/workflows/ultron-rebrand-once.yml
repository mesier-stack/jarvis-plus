name: ULTRON Internal Rebrand

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename core and scrub legacy identity
        shell: bash
        run: |
          set -euo pipefail

          if [ -f jarvis_core.py ]; then
            mv jarvis_core.py ultron_core.py
          fi

          python - <<'PY'
          from pathlib import Path

          allowed = {'.py', '.md', '.bat', '.example', '.txt'}
          replacements = [
              ('from jarvis_core import', 'from ultron_core import'),
              ('import jarvis_core as core', 'import ultron_core as core'),
              ('JarvisBrain', 'UltronBrain'),
              ('JARVIS+', 'ULTRON'),
              ('J.A.R.V.I.S.', 'ULTRON'),
              ('JarvisPlus', 'ULTRON'),
              ('jarvis.db', 'ultron.db'),
              ('.jarvis_data', '.ultron_data'),
              ('jarvis-voice-', 'ultron-voice-'),
              ('jarvis-gemini-', 'ultron-gemini-'),
              ('JARVIS_DATA_DIR', 'ULTRON_DATA_DIR'),
              ('JARVIS_CLOUD_VOICE', 'ULTRON_CLOUD_VOICE'),
              ('JARVIS_VOICE', 'ULTRON_VOICE'),
          ]

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in allowed:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Rewrite transition shim now that the core itself is ULTRON-native.
          branding = Path('ultron_branding.py')
          if branding.exists():
              branding.write_text('''from __future__ import annotations\n\nimport os\nimport shutil\nfrom pathlib import Path\n\n\ndef install_ultron_branding() -> None:\n    import ultron_core as core\n\n    core.APP_NAME = "ULTRON"\n    appdata = Path(os.getenv("APPDATA") or Path.home())\n    data_dir = Path(os.getenv("ULTRON_DATA_DIR") or (appdata / "ULTRON"))\n    data_dir.mkdir(parents=True, exist_ok=True)\n    core.DATA_DIR = data_dir\n\n    # One-time import of data from older local installs. No old branding is used afterward.\n    candidates = [p for p in appdata.iterdir() if p.is_dir() and (p / "jarvis.db").is_file()]\n    new_db = data_dir / "ultron.db"\n    if not new_db.exists():\n        for folder in candidates:\n            try:\n                shutil.copy2(folder / "jarvis.db", new_db)\n                break\n            except OSError:\n                pass\n\n    original_memory_init = core.MemoryStore.__init__\n    def memory_init(self, path=None):\n        return original_memory_init(self, path or new_db)\n    core.MemoryStore.__init__ = memory_init\n\n    def ultron_screenshot():\n        try:\n            from datetime import datetime\n            from PIL import ImageGrab\n            folder = Path.home() / "Pictures" / "ULTRON"\n            folder.mkdir(parents=True, exist_ok=True)\n            path = folder / f"screenshot-{datetime.now():%Y%m%d-%H%M%S}.png"\n            ImageGrab.grab().save(path)\n            return True, f"Screenshot saved to {path}."\n        except Exception as exc:\n            return False, f"I couldn't take the screenshot: {exc}"\n    core.SystemActions.screenshot = staticmethod(ultron_screenshot)\n''', encoding='utf-8')
          PY

          rm -f tests/test_core.py
          rm -f .github/workflows/ultron-rebrand-once.yml

      - name: Commit ULTRON-only source tree
        shell: bash
        run: |
          git config user.name "ULTRON Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Complete ULTRON-only internal rebrand [skip ci]"
          git push
