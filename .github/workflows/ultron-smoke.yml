name: ULTRON Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Import entrypoint
        run: python -c "import ultron_entry; print('ULTRON import smoke test passed')"
      - name: Import every ULTRON module
        shell: pwsh
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          failed=[]
          for p in pathlib.Path('.').glob('ultron*.py'):
              name=p.stem
              try:
                  importlib.import_module(name)
                  print('OK', name)
              except Exception as e:
                  failed.append((name, repr(e)))
                  print('FAIL', name, repr(e))
          if failed:
              print('\nFAILED MODULES:')
              for item in failed: print(item)
              raise SystemExit(1)
          PY
