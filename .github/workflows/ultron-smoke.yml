name: ULTRON Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Import entrypoint
        run: python -c "import ultron_entry; print('ULTRON import smoke test passed')"
      - name: Import every ULTRON module
        run: python tools/smoke_imports.py
      - name: Construct ULTRON app
        run: python tools/smoke_app.py
      - name: Construct major UI panels
        run: python tools/smoke_panels.py
      - name: Exercise safe command paths
        run: python tools/smoke_commands.py
